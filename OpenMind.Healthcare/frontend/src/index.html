<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>OpenMind Health</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 92C50 92 6 66 6 35C6 20 18 9 31 9C40 9 47 14 50 20C53 14 60 9 69 9C82 9 94 20 94 35C94 66 50 92 50 92Z' fill='%230d9488'/><polyline points='22,44 33,44 39,31 47,58 54,38 60,44 76,44' fill='none' stroke='white' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Applied before first paint. Without this the light tokens render for a frame
    // and a dark-mode member sees a white flash on every load.
    (function () {
      try {
        var t = localStorage.getItem('openmind.theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* blocked site data - fall back to the system preference */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
